pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,cjs,mjs,cts,mts,json,jsonc}'
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
  skip:
    - merge
    - rebase
pre-push:
  commands:
    architecture:
      run: pnpm test
